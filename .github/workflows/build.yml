name: Сборка APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # 24.04: Android SDK предустановлен (ANDROID_HOME)
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # нужен только для создания релиза по тегу
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Версия приложения
        run: echo "APP_VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_ENV"

      - name: Сборка release-APK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          set +e
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            # ошибки компиляции и Gradle — в аннотации, чтобы их было видно без полного лога
            { grep -E '^e: ' build.log; grep -A4 'What went wrong' build.log; grep -E 'Could not (find|resolve)' build.log; } | grep -v '^> Task' | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit $code

      - name: "Проверка — в манифесте нет сетевых разрешений"
        run: |
          MANIFEST=$(find app/build/intermediates -name AndroidManifest.xml -path '*merged_manifest*' | head -1)
          echo "Проверяю $MANIFEST"
          [ -n "$MANIFEST" ] || { echo "::error::Итоговый манифест не найден"; exit 1; }
          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "::error::В итоговом манифесте появилось разрешение INTERNET"; exit 1
          fi

      - name: Состав APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*arm64-v8a*.apk | head -1)
          for f in app/build/outputs/apk/release/*.apk; do echo "::notice::$(basename "$f"): $(du -k "$f" | cut -f1) КБ"; done
          echo "::notice::APK $(du -k "$APK" | cut -f1) КБ"
          # группируем по верхнему уровню (lib/arm64-v8a, classes*.dex, res, …): сжатый и полный размер
          unzip -lv "$APK" | awk 'NR>3 && $1 ~ /^[0-9]+$/ {n=$8; split(n,a,"/"); k=(a[1]=="lib")? a[1]"/"a[2] : (n ~ /\.dex$/ ? "dex" : a[1]); full[k]+=$1; comp[k]+=$3} END {for (k in full) printf "%s %d %d\n", k, comp[k]/1024, full[k]/1024}' | sort -k2 -nr | head -12 | while read k c f; do
            echo "::notice::$k — в APK $c КБ, после распаковки $f КБ"
          done
          unzip -lv "$APK" | grep '\.so$' | awk '{printf "::notice::%s — %d КБ (в APK %d КБ)\n", $8, $1/1024, $3/1024}'

      - uses: actions/upload-artifact@v5
        with:
          name: skaner-arm64_${{ env.APP_VERSION }}
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        with:
          name: skaner-armv7-old-phones_${{ env.APP_VERSION }}
          path: app/build/outputs/apk/release/*armeabi-v7a*.apk
          if-no-files-found: error

      # Релиз: создаётся сам при сборке main, если для текущей versionName его ещё нет.
      # Новый релиз = поднять versionCode/versionName в app/build.gradle.kts (+ release-notes/vX.Y.Z.md).
      - name: Релиз на GitHub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$APP_VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Релиз $TAG уже есть — пропускаю"; exit 0
          fi
          NOTES="release-notes/$TAG.md"
          if [ -f "$NOTES" ]; then ARGS=(--notes-file "$NOTES"); else ARGS=(--generate-notes); fi
          gh release create "$TAG" app/build/outputs/apk/release/*.apk \
            --target "$GITHUB_SHA" --title "Сканер $APP_VERSION" "${ARGS[@]}"
          echo "::notice::Создан релиз $TAG"
