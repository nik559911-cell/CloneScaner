name: Сборка APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # 24.04: Android SDK предустановлен (ANDROID_HOME)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Сборка debug-APK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          set +e
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            # ошибки компиляции и Gradle — в аннотации, чтобы их было видно без полного лога
            grep -E '^e: |error:|What went wrong|Could not (find|resolve)|> ' build.log | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit $code

      - name: "Проверка — в манифесте нет сетевых разрешений"
        run: |
          MANIFEST=$(find app/build/intermediates -name AndroidManifest.xml -path '*merged_manifest*' | head -1)
          echo "Проверяю $MANIFEST"
          [ -n "$MANIFEST" ] || { echo "::error::Итоговый манифест не найден"; exit 1; }
          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "::error::В итоговом манифесте появилось разрешение INTERNET"; exit 1
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: skaner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
