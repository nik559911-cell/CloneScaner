name: Сборка APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка debug-APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Проверка: в манифесте нет сетевых разрешений
        run: |
          MANIFEST=app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml
          [ -f "$MANIFEST" ] || MANIFEST=$(find app/build/intermediates -name AndroidManifest.xml -path '*merged_manifest*' | head -1)
          echo "Проверяю $MANIFEST"
          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "::error::В итоговом манифесте появилось разрешение INTERNET"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: skaner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
